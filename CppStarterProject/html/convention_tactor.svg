<?xml version="1.0" encoding="UTF-8"?>
<?xml-stylesheet href="haptx_theme.css" type="text/css"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" width="500px" height="300px" version="1.1" viewBox="0 0 500 300">
<defs>
  <style type="text/css">
   <![CDATA[
   text { font-size: 16px; font-family: var(--haptx-body-font); fill: var(--haptx-foreground); }
   text.axis { font-weight: bold; font-size: 20px; font-style: italic; font-family: "Times New Roman"; }
   .dashed { stroke: var(--haptx-foreground); stroke-width: 1; stroke-dasharray: 4; }
   .outline { stroke: var(--haptx-foreground); stroke-width: 2; fill: none; }
   .arrow { stroke-width: 4px; }
   ]]>
  </style>
  <marker id='arrow-red' fill='var(--primary-red)' viewBox='0 0 10 10' refX='5' refY='5' markerWidth='3' markerHeight='3' orient='auto-start-reverse'><path d='M 0 0 L 10 5 L 0 10 z' /></marker>
  <marker id='arrow-green' fill='var(--primary-green)' viewBox='0 0 10 10' refX='5' refY='5' markerWidth='3' markerHeight='3' orient='auto-start-reverse'><path d='M 0 0 L 10 5 L 0 10 z' /></marker>
  <marker id='arrow-blue' fill='var(--primary-blue)' viewBox='0 0 10 10' refX='5' refY='5' markerWidth='3' markerHeight='3' orient='auto-start-reverse'><path d='M 0 0 L 10 5 L 0 10 z' /></marker>
</defs>
<text x="10" y="25">Top view</text>
<ellipse cx="150" cy="120" rx="100" ry="60" class='outline' />
<line x1="150" y1="120" x2="50" y2="120" class='dashed' />
<line x1="150" y1="120" x2="150" y2="180" class='dashed' />
<line x1="150" y1="120" x2="150" y2="40" class='arrow' style='stroke: var(--primary-green); marker-end: url(#arrow-green);' />
<text x="150" y="25" style='fill: var(--primary-green);' text-anchor='middle' class='axis'>+y</text>
<line x1="150" y1="120" x2="275" y2="120" class='arrow' style='stroke: var(--primary-red); marker-end: url(#arrow-red);' />
<text x="285" y="125" style='fill: var(--primary-red);' text-anchor='start' class='axis'>+x</text>
<text x="10" y="205">Side view</text>
<line x1="50" y1="270" x2="250" y2="270" class='outline' />
<path d="M50,270 C70,220 230,220 250,270" class='outline' />
<line x1="150" y1="270" x2="275" y2="270" class='arrow' style='stroke: var(--primary-red); marker-end: url(#arrow-red);' />
<text x="285" y="275" style='fill: var(--primary-red);' text-anchor='start' class='axis'>+x</text>
<line x1="150" y1="270" x2="150" y2="215" class='arrow' style='stroke: var(--primary-blue); marker-end: url(#arrow-blue);' />
<text x="150" y="205" style='fill: var(--primary-blue);' text-anchor='middle' class='axis'>+z</text>
</svg>
