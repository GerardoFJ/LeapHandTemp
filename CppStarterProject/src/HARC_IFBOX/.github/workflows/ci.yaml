name: CI of HARC_IFBOX

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  run:
    if: github.repository_owner == 'isri-aist'
    runs-on: self-hosted
    steps:
    - name: Setup environment
      uses: jrl-umi3218/github-actions/setup-self-hosted-runner@master
      with:
        GITHUB_PAT: ${{ secrets.CI_GITHUB_PAT }}
    - uses: actions/checkout@v3
      with:
        submodules: recursive
    - name: Install dependencies
      uses: jrl-umi3218/github-actions/install-dependencies@master
      with:
        ubuntu: |
          apt: libncurses-dev
          ros:
            apt: serial
    - name: Build and test
      uses: jrl-umi3218/github-actions/build-cmake-project@master
    - name: Check usage
      uses: jrl-umi3218/github-actions/build-cmake-project@master
      with:
        project-dir: ${{ github.workspace }}/.github/workflows/test_lib_user
